name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check bin/headerhawk.js
      - name: Test
        run: npm test
      - name: Dogfood the CLI
        run: |
          node bin/headerhawk.js --list-checks
          node bin/headerhawk.js --file test/fixtures/strong.txt --fail-under A+
          if node bin/headerhawk.js --file test/fixtures/weak.txt --fail-under C; then
            echo "expected the weak fixture to fail the gate" && exit 1
          fi
          node bin/headerhawk.js --file test/fixtures/weak.txt --format markdown >> "$GITHUB_STEP_SUMMARY"
