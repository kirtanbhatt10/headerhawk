<g class="f0"><clipPath id="c0_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c0_0)"><tspan fill="#3fb950">$ </tspan>headerhawk --file weak-site-headers.txt</text><text class="c0_1" x="18" y="75" xml:space="preserve">headerhawk 0.2.0</text><text class="c0_2" x="18" y="94" xml:space="preserve"></text><text class="c0_3" x="18" y="113" xml:space="preserve">weak-site-headers.txt</text><text class="c0_4" x="18" y="132" xml:space="preserve">  <tspan fill="#ff7b72" font-weight="bold">Grade F</tspan> (0/100)  16 finding(s), 0 check(s) passed</text><text class="c0_5" x="18" y="151" xml:space="preserve">  <tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>     cors                  CORS allows any origin together with credentials</text><text class="c0_6" x="18" y="170" xml:space="preserve">  <tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>     csp                   Content-Security-Policy header missing</text><text class="c0_7" x="18" y="189" xml:space="preserve">  <tspan fill="#ff7b72" font-weight="bold">HIGH</tspan>     hsts                  Strict-Transport-Security header missing</text><text class="c0_8" x="18" y="208" xml:space="preserve">  <tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>   caching               Response sets cookies but may be stored by shared caches</text><text class="c0_9" x="18" y="227" xml:space="preserve">  <tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>   content-type-options  X-Content-Type-Options header missing</text><text class="c0_10" x="18" y="246" xml:space="preserve">  <tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>   cookies               cookie &quot;PHPSESSID&quot; is missing Secure</text><text class="c0_11" x="18" y="265" xml:space="preserve">  <tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>   cookies               cookie &quot;PHPSESSID&quot; is missing HttpOnly</text><text class="c0_12" x="18" y="284" xml:space="preserve">  <tspan fill="#f0b429" font-weight="bold">MEDIUM</tspan>   framing               Page can be framed by other sites (clickjacking)</text><text class="c0_13" x="18" y="303" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      cookies               cookie &quot;PHPSESSID&quot; has no SameSite attribute</text><text class="c0_14" x="18" y="322" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      cross-origin          Cross-Origin-Opener-Policy header missing</text><text class="c0_15" x="18" y="341" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      deprecated            X-XSS-Protection enables the legacy XSS auditor</text><text class="c0_16" x="18" y="360" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      disclosure            Server header reveals a version number</text><text class="c0_17" x="18" y="379" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      disclosure            x-powered-by header reveals the technology stack</text><text class="c0_18" x="18" y="398" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      permissions-policy    Permissions-Policy header missing</text><text class="c0_19" x="18" y="417" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">LOW</tspan>      referrer-policy       Referrer-Policy header missing</text><text class="c0_20" x="18" y="436" xml:space="preserve">  <tspan fill="#79c0ff" font-weight="bold">INFO</tspan>     cross-origin          Cross-Origin-Resource-Policy header missing</text></g><g class="f1"><clipPath id="c1_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c1_0)"><tspan fill="#3fb950">$ </tspan>headerhawk --file hardened-site-headers.txt --fail-under A+</text><text class="c1_1" x="18" y="75" xml:space="preserve">headerhawk 0.2.0</text><text class="c1_2" x="18" y="94" xml:space="preserve"></text><text class="c1_3" x="18" y="113" xml:space="preserve">hardened-site-headers.txt</text><text class="c1_4" x="18" y="132" xml:space="preserve">  Grade A+ (100/100)  0 finding(s), 12 check(s) passed</text><text class="c1_5" x="18" y="151" xml:space="preserve"></text><text class="c1_6" x="18" y="170" xml:space="preserve">exit code 0: deploy gate passed</text></g><g class="f2"><clipPath id="c2_0"><rect x="18" y="41" height="19" width="0"/></clipPath><text x="18" y="56" clip-path="url(#c2_0)"><tspan fill="#3fb950">$ </tspan>headerhawk --file weak-site-headers.txt --fail-under B --format markdown -o report.md</text><text class="c2_1" x="18" y="75" xml:space="preserve">exit code 1: deploy blocked</text></g>
